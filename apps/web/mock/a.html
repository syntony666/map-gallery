<!doctype html><meta charset="utf-8"><style>
  * { margin:0; box-sizing:border-box; font-family:system-ui,sans-serif; }
  body { background:#b9d3de; height:900px; width:1400px; position:relative; overflow:hidden; }
  .switcher { position:absolute; top:18px; left:50%; transform:translateX(-50%);
    background:#fff; border-radius:999px; padding:5px; display:flex; gap:4px;
    box-shadow:0 2px 8px rgba(0,0,0,.15); z-index:5; }
  .switcher span { padding:7px 20px; border-radius:999px; font-size:14px; color:#57534e; }
  .switcher .on { background:#44403c; color:#fff; }
  .eye { position:absolute; top:18px; right:20px; width:38px; height:38px; background:#fff;
    border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,.15); display:flex; align-items:center; justify-content:center; font-size:16px; color:#57534e; }
  .card { position:absolute; right:20px; top:80px; width:340px; background:#fff;
    border-radius:16px; box-shadow:0 4px 20px rgba(0,0,0,.12); padding:14px; }
  .cover { height:170px; border-radius:10px; background:linear-gradient(135deg,#8fb8c9,#5f8fa3); display:flex; align-items:center; justify-content:center; color:#fff; font-size:13px; }
  .t { font-size:17px; font-weight:600; margin:12px 0 2px; color:#1c1917; }
  .s { font-size:13px; color:#78716c; margin-bottom:10px; }
  .btn { background:#44403c; color:#fff; font-size:13px; padding:8px 14px; border-radius:8px; display:inline-block; }
  .thumbs { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin-top:12px; }
  .th { aspect-ratio:1; border-radius:8px; }
</style>
<div class="switcher"><span class="on">台灣</span><span>日本</span><span>世界</span></div>
<div class="eye">👁</div>
<svg width="1400" height="900" viewBox="0 0 1400 900">

      fill="#f3ead9" stroke="#a89e8a" stroke-width="2"/>
    <!-- colored regions -->
    <path d="M90 20 C110 40 120 70 125 100 L80 110 L70 60 Z" fill="#9799FE" opacity=".5" stroke="#7a7ce0" stroke-width="1.5"/>
    <path d="M125 100 L150 180 L155 260 L90 265 L80 200 L80 110 Z" fill="#FFD485" opacity=".55" stroke="#d9b060" stroke-width="1.5"/>
    <path d="M155 260 L165 360 L168 430 L110 440 L95 350 L90 265 Z" fill="#F8B6DA" opacity=".55" stroke="#dd92c0" stroke-width="1.5"/>
    <path d="M168 430 L165 480 C158 560 130 640 95 660 L70 620 L100 500 L110 440 Z" fill="#9799FE" opacity=".5" stroke="#7a7ce0" stroke-width="1.5"/>
    <path d="M80 110 L80 200 L60 210 L45 150 Z" fill="#FFD485" opacity=".55" stroke="#d9b060" stroke-width="1.5"/>
    <path d="M90 265 L95 350 L55 360 L40 290 Z" fill="#F8B6DA" opacity=".55" stroke="#dd92c0" stroke-width="1.5"/>
  </g>
</svg>
<div class="card">
  <div class="cover">台北市封面</div>
  <div class="t">台北市</div>
  <div class="s">12 張照片</div>
  <div class="btn">進入地區 →</div>
  <div class="thumbs">
    <div class="th" style="background:linear-gradient(135deg,#a8c6d4,#6f97ab)"></div>
    <div class="th" style="background:linear-gradient(135deg,#d4c5a8,#ab976f)"></div>
    <div class="th" style="background:linear-gradient(135deg,#c9a8d4,#9a6fab)"></div>
  </div>
</div>
